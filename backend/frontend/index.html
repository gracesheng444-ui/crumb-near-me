<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>上海甜品指南</title>
<link rel="icon" type="image/png" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #fdf6f1;
    --bg-accent: #fff;
    --text: #2a221e;
    --text-dim: #8a7b73;
    --card: #ffffff;
    --border: #f0e0d6;
    --accent: #ef6448;
    --accent-dim: #fbe0d8;
    --accent-2: #dc9257;
    --accent-2-dim: #f8e6d3;
    --user-bubble: #ef6448;
    --user-text: #fff;
    --agent-bubble: #fff;
    --shadow: 0 2px 10px rgba(60, 30, 15, 0.06);
    --shadow-lg: 0 6px 20px rgba(60, 30, 15, 0.1);
    --font-display: "ZCOOL KuaiLe", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: var(--font-display);
    background:
      radial-gradient(circle at 15% 0%, var(--accent-dim), transparent 45%),
      radial-gradient(circle at 100% 15%, var(--accent-2-dim), transparent 40%),
      var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  svg.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }

  .app {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 0;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
    opacity: 0.5;
  }
  .logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 19px;
    margin: 0;
    line-height: 1.3;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  #chat-view, #collection-view, #calendar-view, #community-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 6px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .icon-badge {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 14px;
  }
  .icon-badge.gold { background: var(--accent-2-dim); color: var(--accent-2); }

  .icon-badge-wrap {
    position: relative;
    width: 60px;
    margin: 0 auto 14px;
  }
  .icon-badge-wrap .icon-badge { margin: 0; }
  .sprinkles {
    position: absolute;
    width: 88px;
    height: 88px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    padding: 20px;
  }
  .empty-state p { font-size: 13.5px; max-width: 320px; margin: 4px auto 0; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 12.5px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

  .row {
    display: flex;
    gap: 8px;
    max-width: 88%;
    animation: rise 0.2s ease;
  }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.agent { align-self: flex-start; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
    background: var(--accent-dim);
    color: var(--accent);
  }
  .row.user .avatar { background: var(--accent); color: #fff; }
  .avatar.pin { background: var(--accent-2-dim); color: var(--accent-2); }

  .bubble-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .bubble {
    position: relative;
    padding: 11px 15px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-radius: 20px 20px 6px 20px;
    box-shadow: 0 3px 0 color-mix(in srgb, var(--user-bubble) 75%, black), var(--shadow);
  }
  .row.user .bubble::after {
    right: 9px;
    background: var(--accent-2);
  }
  .row.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 20px 20px 20px 6px;
    box-shadow: 0 3px 0 var(--border), var(--shadow);
  }
  .row.agent .bubble::after {
    left: 9px;
    background: #8fb87a;
  }
  .row.agent .bubble.error {
    background: #fdeceb;
    border-color: #f3b8b0;
    color: #a63a2b;
    box-shadow: 0 3px 0 #f3b8b0, var(--shadow);
  }
  .row.agent .bubble.error::after {
    background: #e28277;
  }

  .replay-btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .replay-btn:hover { color: var(--accent); border-color: var(--accent); }

  .id-card {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 8px 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  .id-card .thumb {
    width: 38px; height: 38px; border-radius: 9px;
    object-fit: cover; flex-shrink: 0; background: var(--accent-2-dim);
  }
  .id-card .name { font-weight: 600; }
  .id-card .sub { color: var(--text-dim); font-size: 11.5px; }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 15px;
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form#chat-form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-accent);
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.5; cursor: default; }

  #message {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 15px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
    max-height: 110px;
    line-height: 1.4;
  }
  #message:focus { outline: none; border-color: var(--accent); }

  #send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  #send-btn:not(:disabled):active { transform: scale(0.92); }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--card);
    box-shadow: 0 -2px 10px rgba(60, 30, 15, 0.05);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #bottom-nav button {
    flex: 1;
    border: none;
    background: none;
    color: var(--text-dim);
    padding: 6px 4px 8px;
    font-size: 11px;
    font-family: var(--font-display);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  #bottom-nav button svg.icon { width: 18px; height: 18px; }
  #bottom-nav .nav-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tab-color);
    opacity: 0.6;
    transition: background 0.18s ease, opacity 0.18s ease, transform 0.15s ease;
  }
  #bottom-nav button.active .nav-icon-wrap {
    opacity: 1;
    background: var(--tab-color-dim);
    transform: scale(1.06);
  }
  #bottom-nav .nav-label { transition: color 0.18s ease; }
  #bottom-nav button.active .nav-label { color: var(--tab-color); font-weight: 600; }

  #tab-chat { --tab-color: var(--accent); --tab-color-dim: var(--accent-dim); }
  #tab-collection { --tab-color: var(--accent-2); --tab-color-dim: var(--accent-2-dim); }
  #tab-calendar { --tab-color: #6f9c5b; --tab-color-dim: #e5efdc; }
  #tab-community { --tab-color: #d6588f; --tab-color-dim: #f9e0ea; }

  #collection-view, #calendar-view {
    overflow-y: auto;
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    box-shadow: var(--shadow);
  }
  .card-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 11px;
  }
  .card-heading .icon-badge {
    width: 28px; height: 28px; font-size: 14px; margin: 0;
  }
  .card-heading h3 {
    font-family: var(--font-display);
    margin: 0;
    font-size: 15.5px;
    color: var(--text);
    font-weight: 400;
  }
  #log-form { display: flex; flex-direction: column; gap: 8px; }
  #log-form input, #log-form textarea {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg-accent);
    color: var(--text);
  }
  #log-form input:focus, #log-form textarea:focus { outline: none; border-color: var(--accent); }
  #log-form textarea { resize: none; min-height: 44px; }
  .star-picker { display: flex; gap: 4px; }
  .star-picker button {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-dim);
    padding: 0;
    line-height: 1;
    font-size: 24px;
    opacity: 0.55;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .star-picker button:hover { opacity: 0.85; transform: scale(1.08); }
  .star-picker button svg.icon path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .star-picker button.filled { color: var(--accent-2); opacity: 1; }
  .star-picker button.filled svg.icon path { fill: currentColor; stroke: none; }
  #log-form-submit {
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-display);
    box-shadow: var(--shadow);
  }
  #log-form-submit:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

  #summary-btn {
    border: 1px solid var(--accent-2);
    background: var(--accent-2-dim);
    color: #8a5527;
    border-radius: 10px;
    padding: 10px;
    font-size: 14.5px;
    cursor: pointer;
    font-family: var(--font-display);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #summary-text {
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
  }

  .log-entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 13px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .log-entry .name { font-weight: 700; font-size: 14px; }
  .log-entry .store { color: var(--text-dim); font-size: 12px; margin-top: 1px; }
  .log-entry .note { font-size: 12.5px; margin-top: 5px; color: var(--text); }
  .log-entry .stars { color: var(--accent-2); margin-top: 5px; display: flex; gap: 1px; }
  .log-entry .stars svg.icon { width: 12px; height: 12px; }
  .log-entry .date { color: var(--text-dim); font-size: 10.5px; margin-top: 5px; }
  .log-entry .del-btn {
    border: none;
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 0;
    height: fit-content;
  }
  .log-entry .del-btn:hover { color: var(--accent); }
  .collection-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px;
  }

  #log-photo-row, #note-photo-row { display: flex; align-items: center; gap: 10px; }
  #log-photo-btn, #note-photo-btn {
    border: 1px solid var(--border);
    background: var(--bg-accent);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #log-photo-preview, #note-photo-preview { position: relative; display: inline-block; }
  #log-photo-preview img, #note-photo-preview img {
    width: 44px; height: 44px; border-radius: 10px;
    object-fit: cover; display: block; border: 1px solid var(--border);
  }
  #log-photo-remove, #note-photo-remove {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 9px; display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
  }
  .log-entry img.thumb {
    width: 52px; height: 52px; border-radius: 11px;
    object-fit: cover; border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .log-entry .entry-body { display: flex; gap: 10px; flex: 1; min-width: 0; }

  #cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  #cal-header h3 { font-family: var(--font-display); margin: 0; font-size: 16.5px; font-weight: 400; }
  #cal-header button {
    border: 1px solid var(--border);
    background: var(--bg-accent);
    color: var(--text);
    border-radius: 9px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: inherit;
  }
  #cal-header button:hover { border-color: var(--accent); color: var(--accent); }
  #cal-weekdays, #cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  #cal-weekdays span {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-dim);
    padding-bottom: 4px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 12px;
    color: var(--text);
    background: var(--bg-accent);
    cursor: default;
    position: relative;
    border: none;
    font-family: inherit;
  }
  .cal-day.empty { visibility: hidden; }
  .cal-day.has-entries {
    background: var(--accent-dim);
    cursor: pointer;
    font-weight: 700;
  }
  .cal-day.has-entries:hover { opacity: 0.85; }
  .cal-day.selected { background: linear-gradient(135deg, var(--accent), #ff9470); color: #fff; }
  .cal-day .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent); margin-top: 2px;
  }
  .cal-day.selected .dot { background: #fff; }

  #cal-day-detail { display: flex; flex-direction: column; gap: 10px; }
  #cal-day-detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-dim);
    padding: 0 2px;
  }
  #cal-day-detail-header.hide { display: none; }
  #cal-clear {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }

  #community-view { overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .segmented {
    display: flex;
    gap: 4px;
    background: var(--bg-accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    flex-shrink: 0;
  }
  .segmented .seg-btn {
    flex: 1;
    border: none;
    background: none;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }
  .segmented .seg-btn.active {
    background: var(--seg-color, var(--accent-2));
    color: #fff;
    box-shadow: var(--shadow);
  }
  #community-view .segmented { --seg-color: #d6588f; }
  #community-pane-browse, #community-pane-publish,
  #collection-pane-log, #collection-pane-view {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .disclaimer {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-accent);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 8px 11px;
  }
  .disclaimer svg.icon { flex-shrink: 0; color: var(--accent-2); }
  #note-form { display: flex; flex-direction: column; gap: 8px; }
  #note-form input, #note-form textarea {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg-accent);
    color: var(--text);
  }
  #note-form input:focus, #note-form textarea:focus { outline: none; border-color: var(--accent); }
  #note-form textarea { resize: none; min-height: 60px; }
  #note-form-submit {
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-display);
    box-shadow: var(--shadow);
  }
  #note-form-submit:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  .note-entry {
    background: var(--card);
    border: 1px solid var(--border);

const log = document.getElementById('log');
const emptyState = document.getElementById('empty-state');
const form = document.getElementById('chat-form');
const input = document.getElementById('message');
const sendBtn = document.getElementById('send-btn');
const photoInput = document.getElementById('photo-input');
const photoBtn = document.getElementById('photo-btn');
const sessionId = crypto.randomUUID();

const AGENT_AVATAR = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="15" r="5"/><circle cx="16" cy="15" r="5" opacity="0.65"/><circle cx="12" cy="7.5" r="4" opacity="0.85"/></svg>';
const USER_AVATAR = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
const PIN_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const SPEAKER_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const CAMERA_TEXT = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const STAR_PATH = 'M12 2.5l3.09 6.26 6.91 1-5 4.87 1.18 6.88L12 17.9l-6.18 3.61L7 14.63l-5-4.87 6.91-1z';
const X_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

function hideEmptyState() {
  if (emptyState) emptyState.remove();
}

function scrollToBottom() {
  log.scrollTop = log.scrollHeight;
}

function addRow(text, who, { isError = false } = {}) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = `row ${who}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.innerHTML = who === 'user' ? USER_AVATAR : AGENT_AVATAR;

  const col = document.createElement('div');
  col.className = 'bubble-col';

  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = text;

  col.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(col);
  log.appendChild(row);
  scrollToBottom();
  return col;
}

function addTypingRow() {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row agent';
  row.innerHTML = `<div class="avatar">${AGENT_AVATAR}</div><div class="typing"><span></span><span></span><span></span></div>`;
  log.appendChild(row);
  scrollToBottom();
  return row;
}

function addReplayButton(col, audioUrl) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'replay-btn';
  btn.innerHTML = `${SPEAKER_ICON} 播放讲解`;
  btn.addEventListener('click', () => new Audio(audioUrl).play());
  col.appendChild(btn);
}

function addIdCard(entry) {
  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row agent';
  const known = entry && entry.id && entry.id !== 'unknown';
  row.innerHTML = `
    <div class="avatar pin">${PIN_ICON}</div>
    <div class="id-card">
      <div class="thumb"></div>
      <div>
        <div class="name">${known ? escapeHtml(entry.name_zh || entry.name_en) : '无法识别这家店'}</div>
        <div class="sub">${known ? escapeHtml(entry.name_en || '') : '试试拍一张更清晰的门头或包装照片'}</div>
      </div>
    </div>`;
  log.appendChild(row);
  scrollToBottom();
  return known;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function sendMessage(message) {
  addRow(message, 'user');
  const typingRow = addTypingRow();
  sendBtn.disabled = true;

  try {
    const body = new FormData();
    body.append('message', message);
    body.append('session_id', sessionId);
    const res = await fetch('/chat', { method: 'POST', body });
    if (!res.ok) throw new Error(`服务器返回了 ${res.status}`);
    const data = await res.json();
    typingRow.remove();
    const col = addRow(data.reply, 'agent');
    if (data.audio_url) {
      addReplayButton(col, data.audio_url);
      new Audio(data.audio_url).play().catch(() => {});
    }
  } catch (err) {
    typingRow.remove();
    addRow(`连接向导时出了点问题 — ${err.message}。请再试一次。`, 'agent', { isError: true });
  } finally {
    sendBtn.disabled = input.value.trim().length === 0;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  sendMessage(message);
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  sendBtn.disabled = input.value.trim().length === 0;
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

document.querySelectorAll('.chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    input.value = chip.dataset.q;
    sendBtn.disabled = false;
    form.requestSubmit();
  });
});

photoBtn.addEventListener('click', () => photoInput.click());

photoInput.addEventListener('change', async () => {
  const file = photoInput.files[0];
  photoInput.value = '';
  if (!file) return;

  hideEmptyState();
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="avatar">${USER_AVATAR}</div><div class="bubble-col"><div class="bubble">${CAMERA_TEXT} ${escapeHtml(file.name)}</div></div>`;
  log.appendChild(row);
  scrollToBottom();

  const typingRow = addTypingRow();
  try {
    const body = new FormData();
    body.append('image', file);
    const res = await fetch('/identify', { method: 'POST', body });
    if (!res.ok) throw new Error(`服务器返回了 ${res.status}`);
    const entry = await res.json();
    typingRow.remove();
    const known = addIdCard(entry);
    if (known) {
      const name = entry.name_zh || entry.name_en;
      sendMessage(`介绍一下${name}`);
    }
  } catch (err) {
    typingRow.remove();
    addRow(`无法识别这张照片 — ${err.message}。`, 'agent', { isError: true });
  }
});

sendBtn.disabled = true;

// --- Bottom tab navigation ---
const navButtons = document.querySelectorAll('#bottom-nav button');
navButtons.forEach((btn) => {
  btn.addEventListener('click', () => {
    navButtons.forEach((b) => b.classList.toggle('active', b === btn));
    document.querySelectorAll('#chat-view, #collection-view, #calendar-view, #community-view').forEach((view) => {
      view.hidden = view.id !== btn.dataset.view;
    });
    if (btn.dataset.view === 'collection-view') {
      loadEntries();
      setCollectionPane('log');
    } else if (btn.dataset.view === 'calendar-view') {
      loadEntries();
    } else if (btn.dataset.view === 'community-view') {
      loadNotes();
      setCommunityPane('browse');
    }
  });
});

// --- Community sub-tabs: browse vs publish ---
const communitySubnavBtns = document.querySelectorAll('#community-subnav .seg-btn');
const communityPaneBrowse = document.getElementById('community-pane-browse');
const communityPanePublish = document.getElementById('community-pane-publish');
function setCommunityPane(pane) {
  communitySubnavBtns.forEach((b) => b.classList.toggle('active', b.dataset.pane === pane));
  communityPaneBrowse.hidden = pane !== 'browse';
  communityPanePublish.hidden = pane !== 'publish';
}
communitySubnavBtns.forEach((btn) => {
  btn.addEventListener('click', () => setCommunityPane(btn.dataset.pane));
});

// --- Collection sub-tabs: log new vs view records ---
const collectionSubnavBtns = document.querySelectorAll('#collection-subnav .seg-btn');
const collectionPaneLog = document.getElementById('collection-pane-log');
const collectionPaneView = document.getElementById('collection-pane-view');
function setCollectionPane(pane) {
  collectionSubnavBtns.forEach((b) => b.classList.toggle('active', b.dataset.pane === pane));
  collectionPaneLog.hidden = pane !== 'log';
  collectionPaneView.hidden = pane !== 'view';
}
collectionSubnavBtns.forEach((btn) => {
  btn.addEventListener('click', () => setCollectionPane(btn.dataset.pane));
});

// --- Personal dessert collection ---
function getUserId() {
  try {
    let id = localStorage.getItem('dessertUserId');
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem('dessertUserId', id);
    }
    return id;
  } catch {
    return sessionId; // localStorage unavailable (private window etc.) — fall back, won't persist
  }
}
const userId = getUserId();

const logForm = document.getElementById('log-form');
const logDessert = document.getElementById('log-dessert');
const logStore = document.getElementById('log-store');
const logNote = document.getElementById('log-note');
const logStars = document.getElementById('log-stars');
const logFormSubmit = document.getElementById('log-form-submit');
const collectionLogList = document.getElementById('collection-log-list');
const summaryBtn = document.getElementById('summary-btn');
const summaryText = document.getElementById('summary-text');
const logPhotoInput = document.getElementById('log-photo-input');
const logPhotoBtn = document.getElementById('log-photo-btn');
const logPhotoPreview = document.getElementById('log-photo-preview');
const logPhotoPreviewImg = document.getElementById('log-photo-preview-img');
const logPhotoRemove = document.getElementById('log-photo-remove');

let selectedRating = 0;
logStars.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => {
    selectedRating = Number(btn.dataset.star);
    logStars.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('filled', Number(b.dataset.star) <= selectedRating);
    });
  });
});

function clearPhotoPicker() {
  logPhotoInput.value = '';
  logPhotoPreview.hidden = true;
  logPhotoBtn.hidden = false;
  logPhotoPreviewImg.src = '';
}

logPhotoBtn.addEventListener('click', () => logPhotoInput.click());
logPhotoInput.addEventListener('change', () => {
  const file = logPhotoInput.files[0];
  if (!file) return;
  logPhotoPreviewImg.src = URL.createObjectURL(file);
  logPhotoPreview.hidden = false;
  logPhotoBtn.hidden = true;
});
logPhotoRemove.addEventListener('click', clearPhotoPicker);

function renderStars(rating) {
  if (!rating) return '';
  let html = '<div class="stars">';
  for (let i = 1; i <= 5; i++) {
    const fill = i <= rating ? 'currentColor' : 'none';
    html += `<svg class="icon" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="${STAR_PATH}"/></svg>`;
  }
  return html + '</div>';
}

function renderLogEntry(entry) {
  const div = document.createElement('div');
  div.className = 'log-entry';
  const date = new Date(entry.created_at).toLocaleDateString('zh-CN');
  div.innerHTML = `
    <div class="entry-body">
      ${entry.photo_url ? `<img class="thumb" src="${entry.photo_url}" alt="" />` : ''}
      <div>
        <div class="name">${escapeHtml(entry.dessert_name)}</div>
        ${entry.store_name ? `<div class="store">${escapeHtml(entry.store_name)}</div>` : ''}
        ${renderStars(entry.rating)}
        ${entry.note ? `<div class="note">${escapeHtml(entry.note)}</div>` : ''}
        <div class="date">${date}</div>
      </div>
    </div>
    <button type="button" class="del-btn" title="删除">${X_ICON}</button>
  `;
  div.querySelector('.del-btn').addEventListener('click', async () => {
    await fetch(`/log/${entry.id}?user_id=${encodeURIComponent(userId)}`, { method: 'DELETE' });
    summaryText.textContent = '';
    loadEntries();
  });
  return div;
}

function renderCollectionList() {
  collectionLogList.innerHTML = '';
  if (allEntries.length === 0) {
    collectionLogList.innerHTML = '<div class="collection-empty">还没有记录任何甜品，去"记录新甜品"添加一个吧。</div>';
    return;
  }
  allEntries.forEach((entry) => collectionLogList.appendChild(renderLogEntry(entry)));
}

// --- Calendar + day detail ---
let allEntries = [];
let calMonth = new Date();
calMonth.setDate(1);
let selectedDate = null; // 'YYYY-MM-DD' or null

const calTitle = document.getElementById('cal-title');
const calGrid = document.getElementById('cal-grid');
const calPrev = document.getElementById('cal-prev');
const calNext = document.getElementById('cal-next');
const calDayDetailHeader = document.getElementById('cal-day-detail-header');
const calDayDetailLabel = document.getElementById('cal-day-detail-label');
const calDayEntries = document.getElementById('cal-day-entries');
const calClear = document.getElementById('cal-clear');

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function renderCalendar() {
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  calTitle.textContent = calMonth.toLocaleDateString('zh-CN', { month: 'long', year: 'numeric' });

  const entriesByDay = {};
  allEntries.forEach((entry) => {
    const key = dateKey(new Date(entry.created_at));
    (entriesByDay[key] = entriesByDay[key] || []).push(entry);
  });

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  calGrid.innerHTML = '';
  for (let i = 0; i < firstWeekday; i++) {
    const filler = document.createElement('div');
    filler.className = 'cal-day empty';
    calGrid.appendChild(filler);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const key = dateKey(new Date(year, month, day));
    const hasEntries = !!entriesByDay[key];
    const btn = document.createElement('button');
    btn.className = 'cal-day' + (hasEntries ? ' has-entries' : '') + (key === selectedDate ? ' selected' : '');
    btn.type = 'button';
    btn.innerHTML = `${day}${hasEntries ? '<span class="dot"></span>' : ''}`;
    if (hasEntries) {
      btn.addEventListener('click', () => {
        selectedDate = selectedDate === key ? null : key;
        renderCalendar();
        renderCalDayDetail();
      });
    }
    calGrid.appendChild(btn);
  }
}

function renderCalDayDetail() {
  if (!selectedDate) {
    calDayDetailHeader.classList.add('hide');
    calDayEntries.innerHTML = `<div class="collection-empty">点击上方有记录的日期查看详情。</div>`;
    return;
  }
  calDayDetailHeader.classList.remove('hide');
  calDayDetailLabel.textContent = selectedDate;
  const entries = allEntries.filter((e) => dateKey(new Date(e.created_at)) === selectedDate);
  calDayEntries.innerHTML = '';
  entries.forEach((entry) => calDayEntries.appendChild(renderLogEntry(entry)));
}

calPrev.addEventListener('click', () => {
  calMonth.setMonth(calMonth.getMonth() - 1);
  renderCalendar();
});
calNext.addEventListener('click', () => {
  calMonth.setMonth(calMonth.getMonth() + 1);
  renderCalendar();
});
calClear.addEventListener('click', () => {
  selectedDate = null;
  renderCalendar();
  renderCalDayDetail();
});

async function loadEntries() {
  try {
    const res = await fetch(`/log?user_id=${encodeURIComponent(userId)}`);
    allEntries = await res.json();
    renderCollectionList();
    renderCalendar();
    renderCalDayDetail();
  } catch (err) {
    collectionLogList.innerHTML = `<div class="collection-empty">无法加载你的甜品记录 — ${escapeHtml(err.message)}。</div>`;
  }
}

logForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const dessertName = logDessert.value.trim();
  if (!dessertName) return;
  logFormSubmit.disabled = true;

  try {
    const body = new FormData();
    body.append('user_id', userId);
    body.append('dessert_name', dessertName);
    body.append('store_name', logStore.value.trim());
    if (selectedRating) body.append('rating', String(selectedRating));
    body.append('note', logNote.value.trim());
    if (logPhotoInput.files[0]) body.append('photo', logPhotoInput.files[0]);
    const res = await fetch('/log', { method: 'POST', body });
    if (!res.ok) throw new Error(`服务器返回了 ${res.status}`);

    logDessert.value = '';
    logStore.value = '';
    logNote.value = '';
    selectedRating = 0;
    logStars.querySelectorAll('button').forEach((b) => b.classList.remove('filled'));
    clearPhotoPicker();
    summaryText.textContent = '';
    loadEntries();
    setCollectionPane('view');
  } catch (err) {
    alert(`保存失败 — ${err.message}`);
  } finally {
    logFormSubmit.disabled = false;
  }
});

summaryBtn.addEventListener('click', async () => {
  summaryBtn.disabled = true;
  summaryText.textContent = '思考中…';
  try {
    const res = await fetch(`/log/summary?user_id=${encodeURIComponent(userId)}`);
    if (!res.ok) throw new Error(`服务器返回了 ${res.status}`);
    const data = await res.json();
    summaryText.textContent = data.summary;
  } catch (err) {
    summaryText.textContent = `无法生成总结 — ${err.message}。`;
  } finally {
    summaryBtn.disabled = false;
  }
});

// --- Community notes ---
const noteForm = document.getElementById('note-form');
const notePlace = document.getElementById('note-place');
const noteText = document.getElementById('note-text');
const noteAuthor = document.getElementById('note-author');
const noteFormSubmit = document.getElementById('note-form-submit');
const communityFeed = document.getElementById('community-feed');
const notePhotoInput = document.getElementById('note-photo-input');
const notePhotoBtn = document.getElementById('note-photo-btn');
const notePhotoPreview = document.getElementById('note-photo-preview');
const notePhotoPreviewImg = document.getElementById('note-photo-preview-img');
const notePhotoRemove = document.getElementById('note-photo-remove');

function clearNotePhotoPicker() {
  notePhotoInput.value = '';
  notePhotoPreview.hidden = true;
  notePhotoBtn.hidden = false;
  notePhotoPreviewImg.src = '';
}

notePhotoBtn.addEventListener('click', () => notePhotoInput.click());
notePhotoInput.addEventListener('change', () => {
  const file = notePhotoInput.files[0];
  if (!file) return;
  notePhotoPreviewImg.src = URL.createObjectURL(file);
  notePhotoPreview.hidden = false;
  notePhotoBtn.hidden = true;
});
notePhotoRemove.addEventListener('click', clearNotePhotoPicker);

function renderNoteEntry(entry) {
  const div = document.createElement('div');
  div.className = 'note-entry';
  const date = new Date(entry.created_at).toLocaleDateString('zh-CN');
  const author = entry.author_name ? escapeHtml(entry.author_name) : '匿名';
  div.innerHTML = `
    <div class="entry-body">
      ${entry.photo_url ? `<img class="thumb" src="${entry.photo_url}" alt="" />` : ''}
      <div>
        <div class="place">${escapeHtml(entry.place_name)}</div>
        <div class="text">${escapeHtml(entry.note)}</div>
        <div class="meta">${author} · ${date}</div>
      </div>
    </div>
    ${entry.user_id === userId ? `<button type="button" class="del-btn" title="删除">${X_ICON}</button>` : ''}
  `;
  const delBtn = div.querySelector('.del-btn');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      await fetch(`/notes/${entry.id}?user_id=${encodeURIComponent(userId)}`, { method: 'DELETE' });
      loadNotes();
    });
  }
  return div;
}

async function loadNotes() {
  try {
    const res = await fetch('/notes');
    const notes = await res.json();
    communityFeed.innerHTML = '';
    if (notes.length === 0) {
      communityFeed.innerHTML = '<div class="collection-empty">还没有人分享，来做第一个吧。</div>';
      return;
    }
    notes.forEach((entry) => communityFeed.appendChild(renderNoteEntry(entry)));
  } catch (err) {
    communityFeed.innerHTML = `<div class="collection-empty">无法加载社区分享 — ${escapeHtml(err.message)}。</div>`;
  }
}

noteForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const placeName = notePlace.value.trim();
  const text = noteText.value.trim();
  if (!placeName || !text) return;
  noteFormSubmit.disabled = true;

  try {
    const body = new FormData();
    body.append('place_name', placeName);
    body.append('note', text);
    body.append('author_name', noteAuthor.value.trim());
    body.append('user_id', userId);
    if (notePhotoInput.files[0]) body.append('photo', notePhotoInput.files[0]);
    const res = await fetch('/notes', { method: 'POST', body });
    if (!res.ok) throw new Error(`服务器返回了 ${res.status}`);

    notePlace.value = '';
    noteText.value = '';
    noteAuthor.value = '';
    clearNotePhotoPicker();
    loadNotes();
    setCommunityPane('browse');
  } catch (err) {
    alert(`发布失败 — ${err.message}`);
  } finally {
    noteFormSubmit.disabled = false;
  }
});
</script>
