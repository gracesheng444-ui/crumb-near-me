<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crumb Near Me</title>
<link rel="icon" type="image/png" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #fdf6f1;
    --bg-accent: #fff;
    --text: #2a221e;
    --text-dim: #8a7b73;
    --card: #ffffff;
    --border: #f0e0d6;
    --accent: #ef6448;
    --accent-dim: #fbe0d8;
    --accent-2: #dc9257;
    --accent-2-dim: #f8e6d3;
    --user-bubble: #ef6448;
    --user-text: #fff;
    --agent-bubble: #fff;
    --shadow: 0 2px 10px rgba(60, 30, 15, 0.06);
    --shadow-lg: 0 6px 20px rgba(60, 30, 15, 0.1);
    --font-display: "ZCOOL KuaiLe", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: var(--font-display);
    background:
      radial-gradient(circle at 15% 0%, var(--accent-dim), transparent 45%),
      radial-gradient(circle at 100% 15%, var(--accent-2-dim), transparent 40%),
      var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  svg.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }

  .app {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 0;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
    opacity: 0.5;
  }
  .logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 19px;
    margin: 0;
    line-height: 1.3;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  #exit-demo-btn {
    margin-left: auto;
    align-self: center;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #exit-demo-btn:hover { background: var(--accent-dim); color: var(--accent); }
  #exit-demo-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #chat-view, #collection-view, #community-view, #settings-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 6px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .icon-badge {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 14px;
  }
  .icon-badge.gold { background: var(--accent-2-dim); color: var(--accent-2); }

  .icon-badge-wrap {
    position: relative;
    width: 60px;
    margin: 0 auto 14px;
  }
  .icon-badge-wrap .icon-badge { margin: 0; }
  .sprinkles {
    position: absolute;
    width: 88px;
    height: 88px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    padding: 20px;
  }
  .empty-state p { font-size: 13.5px; max-width: 320px; margin: 4px auto 0; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 12.5px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

  .row {
    display: flex;
    gap: 8px;
    max-width: 88%;
    animation: rise 0.2s ease;
  }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.agent { align-self: flex-start; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
    background: var(--accent-dim);
    color: var(--accent);
  }
  .row.user .avatar { background: var(--accent); color: #fff; }
  .avatar.pin { background: var(--accent-2-dim); color: var(--accent-2); }

  .bubble-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .bubble {
    position: relative;
    padding: 11px 15px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-radius: 20px 20px 6px 20px;
    box-shadow: 0 3px 0 color-mix(in srgb, var(--user-bubble) 75%, black), var(--shadow);
  }
  .row.user .bubble::after {
    right: 9px;
    background: var(--accent-2);
  }
  .row.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 20px 20px 20px 6px;
    box-shadow: 0 3px 0 var(--border), var(--shadow);
  }
  .row.agent .bubble::after {
    left: 9px;
    background: #8fb87a;
  }
  .row.agent .bubble.error {
    background: #fdeceb;
    border-color: #f3b8b0;
    color: #a63a2b;
    box-shadow: 0 3px 0 #f3b8b0, var(--shadow);
  }
  .row.agent .bubble.error::after {
    background: #e28277;
  }

  .replay-btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .replay-btn:hover { color: var(--accent); border-color: var(--accent); }

  .id-card {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 8px 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  .id-card .thumb {
    width: 38px; height: 38px; border-radius: 9px;
    object-fit: cover; flex-shrink: 0; background: var(--accent-2-dim);
  }
  .id-card .name { font-weight: 600; }
  .id-card .sub { color: var(--text-dim); font-size: 11.5px; }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 15px;
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form#chat-form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-accent);
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.5; cursor: default; }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn.recording {
    background: #e5484d;
    border-color: transparent;
    color: #fff;
    animation: micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0.45); }
    50% { box-shadow: 0 0 0 6px rgba(229, 72, 77, 0); }
  }

  #message {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 15px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
    max-height: 110px;
    line-height: 1.4;
  }
  #message:focus { outline: none; border-color: var(--accent); }

  #send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  #send-btn:not(:disabled):active { transform: scale(0.92); }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--card);
    box-shadow: 0 -2px 10px rgba(60, 30, 15, 0.05);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #bottom-nav button {
    flex: 1;
    border: none;
    background: none;
    color: var(--text-dim);
    padding: 6px 4px 8px;
    font-size: 11px;
    font-family: var(--font-display);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  #bottom-nav button svg.icon { width: 18px; height: 18px; }
  #bottom-nav .nav-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tab-color);
    opacity: 0.6;
    transition: background 0.18s ease, opacity 0.18s ease, transform 0.15s ease;
  }
  #bottom-nav button.active .nav-icon-wrap {
    opacity: 1;
    background: var(--tab-color-dim);
    transform: scale(1.06);
  }
  #bottom-nav .nav-label { transition: color 0.18s ease; }
  #bottom-nav button.active .nav-label { color: var(--tab-color); font-weight: 600; }

  #tab-chat { --tab-color: var(--accent); --tab-color-dim: var(--accent-dim); }
  #tab-collection { --tab-color: var(--accent-2); --tab-color-dim: var(--accent-2-dim); }
  #tab-community { --tab-color: #d6588f; --tab-color-dim: #f9e0ea; }
  #tab-settings { --tab-color: #c9852e; --tab-color-dim: #f5e6cd; }

  #collection-view {
    overflow-y: auto;
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    box-shadow: var(--shadow);
  }
  .card-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 11px;
  }
  .card-heading .icon-badge {
    width: 28px; height: 28px; font-size: 14px; margin: 0;
  }
  .card-heading h3 {
    font-family: var(--font-display);
    margin: 0;
    font-size: 15.5px;
    color: var(--text);
    font-weight: 400;
  }
  .card-heading-add {
    margin-left: auto;
    border: none;
    background: none;
    color: var(--accent-2);
    font-family: var(--font-display);
    font-size: 12.5px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
  }
  .card-heading-add:hover { background: var(--accent-2-dim); }
  .card-heading-add:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  #log-form, .dessert-form { display: flex; flex-direction: column; gap: 8px; }
  #log-form input, #log-form textarea, .dessert-form input, .dessert-form textarea {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg-accent);
    color: var(--text);
  }
  #log-form input:focus, #log-form textarea:focus,
  .dessert-form input:focus, .dessert-form textarea:focus { outline: none; border-color: var(--accent); }
  #log-form textarea, .dessert-form textarea { resize: none; min-height: 44px; }
  .star-picker { display: flex; gap: 4px; }
  .star-picker button {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-dim);
    padding: 0;
    line-height: 1;
    font-size: 24px;
    opacity: 0.55;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .star-picker button:hover { opacity: 0.85; transform: scale(1.08); }
  .star-picker button svg.icon path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .star-picker button.filled { color: var(--accent-2); opacity: 1; }
  .star-picker button.filled svg.icon path { fill: currentColor; stroke: none; }
  #log-form-submit, .dessert-form-submit {
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-display);
    box-shadow: var(--shadow);
  }
  #log-form-submit:disabled, .dessert-form-submit:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  #log-planned-date-field, .field-group { display: flex; flex-direction: column; gap: 4px; }
  #log-form-cancel-edit, .dessert-form-cancel {
    border: 1px solid var(--border); background: none; color: var(--text-dim);
    border-radius: 10px; padding: 9px; font-size: 13.5px; cursor: pointer;
    font-family: var(--font-display);
  }
  #log-form-cancel-edit:hover, .dessert-form-cancel:hover { border-color: var(--accent); color: var(--accent); }

  #summary-btn {
    border: 1px solid var(--accent-2);
    background: var(--accent-2-dim);
    color: #8a5527;
    border-radius: 10px;
    padding: 10px;
    font-size: 14.5px;
    cursor: pointer;
    font-family: var(--font-display);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #summary-text {
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
  }

  .collection-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px;
  }

  #wishlist-list { display: flex; flex-direction: column; gap: 10px; }
  .wishlist-entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 13px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .wishlist-entry-head { display: flex; justify-content: space-between; gap: 10px; }
  .wishlist-entry .place { font-weight: 700; font-size: 14px; }
  .wishlist-entry .text { font-size: 13px; margin-top: 4px; color: var(--text); }
  .wishlist-entry .meta { color: var(--text-dim); font-size: 10.5px; margin-top: 6px; }
  .wishlist-actions { display: flex; gap: 8px; align-items: flex-start; flex-shrink: 0; }
  .wishlist-actions .del-btn, .wishlist-actions .edit-btn {
    border: none; background: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 0; height: fit-content;
  }
  .wishlist-actions .del-btn:hover, .wishlist-actions .edit-btn:hover { color: var(--accent); }
  .wishlist-actions .del-btn:focus-visible, .wishlist-actions .edit-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .wishlist-complete-btn {
    border: 1px solid var(--accent-2); background: var(--accent-2-dim); color: #8a5527;
    border-radius: 9px; padding: 7px 10px; font-size: 12.5px; cursor: pointer;
    font-family: var(--font-display); align-self: flex-start;
  }
  .wishlist-complete-btn:hover { border-color: var(--accent-2); background: var(--accent-2); color: #fff; }
  .wishlist-complete-btn:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .wishlist-complete-form { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--border); }
  .wishlist-complete-form textarea {
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    font-size: 13.5px; font-family: inherit; background: var(--bg-accent); color: var(--text);
    resize: none; min-height: 40px;
  }
  .wishlist-complete-form textarea:focus { outline: none; border-color: var(--accent); }
  .wishlist-confirm-btn {
    border: none; background: linear-gradient(135deg, var(--accent), #ff9470); color: #fff;
    border-radius: 10px; padding: 9px; font-size: 13.5px; cursor: pointer; font-family: var(--font-display);
  }
  .wishlist-confirm-btn:disabled { opacity: 0.5; cursor: default; }

  #log-photo-row, #note-photo-row, .wishlist-photo-row { display: flex; align-items: center; gap: 10px; }
  #log-photo-btn, #note-photo-btn, .wishlist-photo-btn {
    border: 1px solid var(--border);
    background: var(--bg-accent);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #log-photo-preview, #note-photo-preview, .wishlist-photo-preview { position: relative; display: inline-block; }
  #log-photo-preview img, #note-photo-preview img, .wishlist-photo-preview img {
    width: 44px; height: 44px; border-radius: 10px;
    object-fit: cover; display: block; border: 1px solid var(--border);
  }
  #log-photo-remove, #note-photo-remove, .wishlist-photo-remove {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 9px; display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
  }
  #log-photo-remove:focus-visible, #note-photo-remove:focus-visible, .wishlist-photo-remove:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #log-photo-row { flex-wrap: wrap; }
  .log-photo-thumb { position: relative; display: inline-block; }
  .log-photo-thumb img {
    width: 44px; height: 44px; border-radius: 10px;
    object-fit: cover; display: block; border: 1px solid var(--border);
  }
  .log-photo-thumb-remove {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 9px; display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
  }
  .log-photo-thumb-remove:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #notebook {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 18px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 440px;
    position: relative;
  }
  #notebook-page {
    flex: 1;
    display: flex;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .notebook-page-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

// Shared by every photo-upload picker (profile-setup avatar, settings
// avatar, dessert-log photo, community-note photo) — they all stage a
// chosen file the same way: hidden <input type="file">, a trigger button,
// a preview <img>, and a reset.
function setupPhotoPicker({ input, btn, preview, previewImg, onChange }) {
  function reset() {
    input.value = '';
    preview.hidden = true;
    btn.hidden = false;
    previewImg.src = '';
  }
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    previewImg.src = URL.createObjectURL(file);
    preview.hidden = false;
    btn.hidden = true;
    onChange?.(file);
  });
  return { reset, getFile: () => input.files[0] || null };
}

async function initSupabaseAuth() {
  const cfg = await fetch('/config').then((r) => r.json());
  supabaseClient = supabase.createClient(cfg.supabase_url, cfg.supabase_publishable_key);

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    authToken = session ? session.access_token : null;
    if (session) {
      userId = session.user.id;
      currentUserEmail = session.user.email || null;
      enterApp();
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    authToken = session.access_token;
    userId = session.user.id;
    currentUserEmail = session.user.email || null;
    enterApp();
  } else if (localStorage.getItem('authMode') !== 'guest') {
    authView.hidden = false;
    mainApp.hidden = true;
  }
}

// --- Voice input: record with MediaRecorder, transcribe server-side, fill
// the message box for the user to review/edit before sending. Never
// auto-sends — the transcript is just text in the input like anything typed.
// Qwen3-ASR-Flash accepts whatever container/codec the browser produces
// directly as a base64 data URI, so no client-side PCM capture/resampling
// is needed — MediaRecorder's default output (audio/webm) works as-is.
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

micBtn.addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});

async function startRecording() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    addRow(t('micPermissionDenied', { msg: err.message }), 'agent', { isError: true });
    return;
  }
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = function () {
    // `this`, not the outer `mediaRecorder` variable: stopRecording() below
    // sets that to null right after calling .stop(), and this handler only
    // runs later, asynchronously, once the recorder has actually finished.
    stream.getTracks().forEach((track) => track.stop());
    const blob = new Blob(recordedChunks, { type: this.mimeType });
    recordedChunks = [];
    sendRecording(blob);
  };
  mediaRecorder.start();

  isRecording = true;
  micBtn.classList.add('recording');
  micBtn.title = t('micStopTitle');
  photoBtn.disabled = true;
}

function stopRecording() {
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.title = t('micBtnTitle');
  photoBtn.disabled = false;
  mediaRecorder.stop();
  mediaRecorder = null;
}

async function sendRecording(blob) {
  const previousPlaceholder = input.placeholder;
  micBtn.disabled = true;
  input.placeholder = t('transcribing');
  try {
    const body = new FormData();
    body.append('audio', blob, 'recording.webm');
    const res = await fetch('/transcribe', { method: 'POST', body });
    if (!res.ok) throw new Error(t('httpError', { status: res.status }));
    const data = await res.json();
    if (data.text) {
      input.value = input.value ? (input.value.trimEnd() + ' ' + data.text) : data.text;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }
  } catch (err) {
    addRow(t('transcribeFailed', { msg: err.message }), 'agent', { isError: true });
  } finally {
    micBtn.disabled = false;
    input.placeholder = previousPlaceholder;
  }
}

// Multiple photos per log entry: unlike setupPhotoPicker (single file), this
// keeps its own file array across repeated picks, since <input multiple>
// replaces input.files wholesale on every selection rather than appending.
function setupMultiPhotoPicker({ input, btn, row, maxFiles = 6 }) {
  let files = [];
  function renderThumbs() {
    row.querySelectorAll('.log-photo-thumb').forEach((el) => el.remove());
    files.forEach((file, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'log-photo-thumb';
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = '';
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'log-photo-thumb-remove';
      removeBtn.innerHTML = X_ICON;
      removeBtn.addEventListener('click', () => {
        files.splice(i, 1);
        renderThumbs();
      });
      wrap.appendChild(img);
      wrap.appendChild(removeBtn);
      row.insertBefore(wrap, btn);
    });
    btn.hidden = files.length >= maxFiles;
  }
  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    for (const f of input.files) {
      if (files.length < maxFiles) files.push(f);
    }
    input.value = '';
    renderThumbs();
  });
  function reset() {
    files = [];
    renderThumbs();
  }
  return { reset, getFiles: () => files };
}

function renderNotebookStars(rating) {
  if (!rating) return '';
  let html = '<div class="notebook-stars">';
  for (let i = 1; i <= 5; i++) {
    const fill = i <= rating ? 'currentColor' : 'none';
    html += `<svg class="icon" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="${STAR_PATH}"/></svg>`;
  }
  return html + '</div>';
}

function buildNotebookEntryPage(entry) {
  const page = document.createElement('div');
  page.className = 'notebook-page-content';
  const photos = entry.photo_urls && entry.photo_urls.length ? entry.photo_urls : (entry.photo_url ? [entry.photo_url] : []);
  const multi = photos.length > 1;
  const dateLabel = new Date(entry.created_at).toLocaleDateString(currentLang === 'en' ? 'en-US' : 'zh-CN');

  const tiltClass = entry.id % 2 === 0 ? 'tilt-left' : 'tilt-right';
  const photoBlock = photos.length
    ? `<div class="notebook-photo-carousel${multi ? ' has-multiple' : ''}">
        ${multi ? '<div class="notebook-photo-stack-peek second"></div><div class="notebook-photo-stack-peek"></div>' : ''}
        <div class="notebook-photo-frame ${tiltClass}"><img src="${photos[0]}" alt="" /></div>
        ${multi ? `<div class="notebook-photo-dots">${photos.map((_, i) => `<button type="button" class="dot${i === 0 ? ' active' : ''}" data-i="${i}" aria-label="${t('photoNum', { n: i + 1 })}"></button>`).join('')}</div>` : ''}
      </div>`
    : `<div class="notebook-photo-carousel"><div class="notebook-photo-frame placeholder ${tiltClass}"><img src="/icon.png" alt="" /></div></div>`;

  page.innerHTML = `
    <div class="notebook-body">
      ${photoBlock}
      <div class="notebook-title">${escapeHtml(entry.dessert_name)}</div>
      ${entry.store_name ? `<div class="notebook-store">${PIN_ICON}${escapeHtml(entry.store_name)}</div>` : ''}
      <div class="notebook-date">${dateLabel}</div>
      ${renderNotebookStars(entry.rating)}
      ${entry.note ? `<div class="notebook-note">${escapeHtml(entry.note)}</div>` : ''}
    </div>
    <div class="notebook-actions">
      <button type="button" class="notebook-edit-btn" title="${t('edit')}">${EDIT_ICON}</button>
      <button type="button" class="notebook-del-btn" title="${t('delete')}">${X_ICON}</button>
    </div>
  `;

  if (multi) {
    let photoIndex = 0;
    const frameImg = page.querySelector('.notebook-photo-frame img');
    const dots = page.querySelectorAll('.notebook-photo-dots .dot');
    const showPhoto = (i) => {
      photoIndex = i;
      frameImg.src = photos[photoIndex];
      dots.forEach((d, di) => d.classList.toggle('active', di === photoIndex));
    };
    page.querySelector('.notebook-photo-frame').addEventListener('click', () => showPhoto((photoIndex + 1) % photos.length));
    dots.forEach((d) => d.addEventListener('click', (e) => {
      e.stopPropagation();
      showPhoto(Number(d.dataset.i));
    }));
  }

  page.querySelector('.notebook-edit-btn').addEventListener('click', () => enterEditLogMode(entry));
  page.querySelector('.notebook-del-btn').addEventListener('click', async () => {
    await fetch(`/log/${entry.id}?user_id=${encodeURIComponent(userId)}`, { method: 'DELETE', headers: authHeaders() });
    summaryText.textContent = '';
    loadEntries();
  });
  return page;
}

  page.className = 'notebook-page-content centered';
  page.innerHTML = `

}

// --- Notebook (flip-through pages: one per logged dessert) ---
let allEntries = [];
let notebookIndex = 0;

const notebookPageEl = document.getElementById('notebook-page');
const notebookPrevBtn = document.getElementById('notebook-prev');
const notebookNextBtn = document.getElementById('notebook-next');
const notebookIndicator = document.getElementById('notebook-page-indicator');

function getNotebookEntries() {
  return allEntries.filter((e) => e.status !== 'planned'); // already newest-first from the API
}

function renderNotebook() {
  const entries = getNotebookEntries();
  notebookIndex = Math.max(0, Math.min(notebookIndex, Math.max(entries.length - 1, 0)));

  notebookPageEl.innerHTML = '';
  notebookPageEl.appendChild(
    entries.length === 0 ? buildNotebookEmptyPage() : buildNotebookEntryPage(entries[notebookIndex])
  );

  notebookIndicator.textContent = entries.length === 0 ? '' : `${notebookIndex + 1} / ${entries.length}`;
  notebookPrevBtn.disabled = notebookIndex === 0 || entries.length === 0;
  notebookNextBtn.disabled = entries.length === 0 || notebookIndex === entries.length - 1;
}

function flipNotebook(direction) {
  notebookPageEl.classList.add(direction > 0 ? 'flip-next' : 'flip-prev');
  setTimeout(() => {
    notebookIndex += direction;
    renderNotebook();
    notebookPageEl.classList.remove('flip-next', 'flip-prev');
  }, 200);
}

notebookPrevBtn.addEventListener('click', () => {
  if (notebookIndex > 0) flipNotebook(-1);
});
notebookNextBtn.addEventListener('click', () => {
  if (notebookIndex < getNotebookEntries().length - 1) flipNotebook(1);
});

  wishlistFormMsg.hidden = true;

    body.append('note', wishlistNote.value.trim());
    body.append('planned_date', wishlistPlannedDate.value);

    } else {
      body.append('status', 'planned');
      res = await fetch('/log', { method: 'POST', body, headers: authHeaders() });

    resetWishlistForm();
    hideWishlistForm();
    loadEntries();

function renderWishlistEntry(entry) {
  const div = document.createElement('div');
  div.className = 'wishlist-entry';
  const dateLabel = entry.planned_date
    ? new Date(`${entry.planned_date}T00:00:00`).toLocaleDateString(currentLang === 'en' ? 'en-US' : 'zh-CN')
    : '';
  div.innerHTML = `
    <div class="wishlist-entry-head">
      <div>
        <div class="place">${escapeHtml(entry.dessert_name)}</div>
        ${entry.store_name ? `<div class="text">${escapeHtml(entry.store_name)}</div>` : ''}
        ${entry.note ? `<div class="text">${escapeHtml(entry.note)}</div>` : ''}
        ${dateLabel ? `<div class="meta">${t('plannedDateLabel', { date: dateLabel })}</div>` : ''}
      </div>
      <div class="wishlist-actions">
        <button type="button" class="edit-btn" title="${t('edit')}">${EDIT_ICON}</button>
        <button type="button" class="del-btn" title="${t('delete')}">${X_ICON}</button>
      </div>
    </div>
    <button type="button" class="wishlist-complete-btn">${t('markAsTried')}</button>
    <div class="wishlist-complete-form" hidden>
      <div class="star-picker"></div>
      <textarea placeholder="${t('thoughtsPh')}"></textarea>
      <div class="wishlist-photo-row">
        <button type="button" class="wishlist-photo-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          ${t('addPhoto')}
        </button>
        <input type="file" accept="image/*" hidden />
        <div class="wishlist-photo-preview" hidden>
          <img alt="${t('previewAlt')}" />
          <button type="button" class="wishlist-photo-remove">${X_ICON}</button>
        </div>
      </div>
      <button type="button" class="wishlist-confirm-btn">${t('confirmTried')}</button>
      <p class="form-msg wishlist-complete-msg" hidden></p>
    </div>
  `;

  let completeRating = 0;
  const starPickerEl = div.querySelector('.star-picker');
  for (let i = 1; i <= 5; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.star = String(i);
    btn.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="${STAR_PATH}"/></svg>`;
    btn.addEventListener('click', () => {
      completeRating = i;
      starPickerEl.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('filled', Number(b.dataset.star) <= completeRating);
      });
    });
    starPickerEl.appendChild(btn);
  }

  const completeNote = div.querySelector('.wishlist-complete-form textarea');
  const completePhoto = setupPhotoPicker({
    input: div.querySelector('.wishlist-photo-row input[type="file"]'),
    btn: div.querySelector('.wishlist-photo-btn'),
    preview: div.querySelector('.wishlist-photo-preview'),
    previewImg: div.querySelector('.wishlist-photo-preview img'),
  });

  const completeForm = div.querySelector('.wishlist-complete-form');
  div.querySelector('.wishlist-complete-btn').addEventListener('click', () => {
    completeForm.hidden = !completeForm.hidden;
  });

  const confirmBtn = div.querySelector('.wishlist-confirm-btn');
  const confirmMsg = div.querySelector('.wishlist-complete-msg');
  confirmBtn.addEventListener('click', async () => {
    confirmBtn.disabled = true;
    confirmMsg.hidden = true;
    try {
      const body = new FormData();
      body.append('user_id', userId);
      if (completeRating) body.append('rating', String(completeRating));
      body.append('note', completeNote.value.trim());
      if (completePhoto.getFile()) body.append('photo', completePhoto.getFile());
      const res = await fetch(`/log/${entry.id}/complete`, { method: 'POST', body, headers: authHeaders() });
      if (!res.ok) throw new Error(t('httpError', { status: res.status }));
      summaryText.textContent = '';
      loadEntries();
    } catch (err) {
      showFormMsg(confirmMsg, t('saveFailed', { msg: err.message }));
    } finally {
      confirmBtn.disabled = false;
    }
  });

  div.querySelector('.edit-btn').addEventListener('click', () => enterEditWishlistMode(entry));
  div.querySelector('.del-btn').addEventListener('click', async () => {
    await fetch(`/log/${entry.id}?user_id=${encodeURIComponent(userId)}`, { method: 'DELETE', headers: authHeaders() });
    loadEntries();
  });

  return div;
}

function renderWishlistList() {

    wishlistList.innerHTML = `<div class="collection-empty">${t('wishlistEmpty')}</div>`;

  entries.forEach((entry) => wishlistList.appendChild(renderWishlistEntry(entry)));

async function loadEntries() {
  try {
    const res = await fetch(`/log?user_id=${encodeURIComponent(userId)}`, { headers: authHeaders() });
    allEntries = await res.json();
    renderNotebook();
    renderWishlistList();
  } catch (err) {
    notebookPageEl.innerHTML = `<div class="notebook-page-content centered"><div class="notebook-heading">${escapeHtml(t('loadLogsFailed', { msg: err.message }))}</div></div>`;
  }

  e.preventDefault();
  const dessertName = logDessert.value.trim();
  if (!dessertName) return;
  if (!editingLogId && logPhoto.getFiles().length === 0) {
    showFormMsg(logFormMsg, t('photoRequired'));
    return;
  }
  logFormSubmit.disabled = true;
  logFormMsg.hidden = true;

  const wasEditing = editingLogId;

  try {
    const body = new FormData();
    body.append('user_id', userId);
    body.append('dessert_name', dessertName);
    body.append('store_name', logStore.value.trim());
    if (selectedRating) body.append('rating', String(selectedRating));
    body.append('note', logNote.value.trim());
    let res;
    if (wasEditing) {
      body.append('planned_date', editingLogPlannedDate);
      res = await fetch(`/log/${wasEditing}`, { method: 'PATCH', body, headers: authHeaders() });
    } else {
      body.append('status', 'eaten');
      logPhoto.getFiles().forEach((f) => body.append('photos', f));
      res = await fetch('/log', { method: 'POST', body, headers: authHeaders() });
    }
    if (!res.ok) throw new Error(t('httpError', { status: res.status }));

    resetLogForm();
    summaryText.textContent = '';
    notebookIndex = 0;
    loadEntries();
    setCollectionPane('view');

    showFormMsg(logFormMsg, t('saveFailed', { msg: err.message }));

    logFormSubmit.disabled = false;

});

function renderNoteEntry(entry) {
  const div = document.createElement('div');
  div.className = 'note-entry';
  const date = new Date(entry.created_at).toLocaleDateString(currentLang === 'en' ? 'en-US' : 'zh-CN');
  const author = entry.author_name ? escapeHtml(entry.author_name) : t('anonymous');
  const isOwn = entry.user_id === userId;
  div.innerHTML = `
    <div class="entry-body">
      ${entry.photo_url ? `<img class="thumb" src="${entry.photo_url}" alt="" />` : ''}
      <div>
        <div class="place">${escapeHtml(entry.place_name)}</div>
        <div class="text">${escapeHtml(entry.note)}</div>
        <div class="meta">${author} · ${date}</div>
      </div>
    </div>
    ${isOwn ? `
    <div class="entry-actions">
      <button type="button" class="edit-btn" title="${t('edit')}">${EDIT_ICON}</button>
      <button type="button" class="del-btn" title="${t('delete')}">${X_ICON}</button>
    </div>` : ''}
  `;
  if (isOwn) {
    div.querySelector('.edit-btn').addEventListener('click', () => enterEditNoteMode(entry));
    div.querySelector('.del-btn').addEventListener('click', async () => {
      await fetch(`/notes/${entry.id}?user_id=${encodeURIComponent(userId)}`, { method: 'DELETE', headers: authHeaders() });
      loadNotes();
    });
  }
  return div;
}

async function loadNotes() {
  try {
    const res = await fetch('/notes');
    const notes = await res.json();
    communityFeed.innerHTML = '';
    if (notes.length === 0) {
      communityFeed.innerHTML = `<div class="collection-empty">${t('communityEmpty')}</div>`;
      return;
    }
    notes.forEach((entry) => communityFeed.appendChild(renderNoteEntry(entry)));
  } catch (err) {
    communityFeed.innerHTML = `<div class="collection-empty">${escapeHtml(t('loadNotesFailed', { msg: err.message }))}</div>`;
  }
}

noteForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const placeName = notePlace.value.trim();
  const text = noteText.value.trim();
  if (!placeName || !text) return;
  noteFormSubmit.disabled = true;
  noteFormMsg.hidden = true;

  const wasEditing = editingNoteId;

  try {
    const body = new FormData();
    body.append('place_name', placeName);
    body.append('note', text);
    body.append('user_id', userId);
    let res;
    if (wasEditing) {
      res = await fetch(`/notes/${wasEditing}`, { method: 'PATCH', body, headers: authHeaders() });
    } else {
      body.append('author_name', noteAuthor.value.trim());
      if (notePhoto.getFile()) body.append('photo', notePhoto.getFile());
      res = await fetch('/notes', { method: 'POST', body, headers: authHeaders() });
    }
    if (!res.ok) throw new Error(t('httpError', { status: res.status }));

    resetNoteForm();
    loadNotes();
    setCommunityPane('browse');
  } catch (err) {
    showFormMsg(noteFormMsg, t('publishFailed', { msg: err.message }));
  } finally {
    noteFormSubmit.disabled = false;
  }
});

// --- Settings tab: profile (name + avatar) and account status ---
function updateSettingsAccountView() {
  const signedIn = !!authToken;
  settingsAccountSignedin.hidden = !signedIn;
  settingsAccountGuest.hidden = signedIn;
  if (signedIn) settingsEmail.textContent = currentUserEmail || '';
  const exitLabel = signedIn ? t('logout') : t('exitGuestMode');
  exitDemoBtnLabel.textContent = exitLabel;
  exitDemoBtn.title = exitLabel;
}

const settingsAvatarPhoto = setupPhotoPicker({
  input: settingsAvatarPhotoInput,
  btn: settingsAvatarPhotoBtn,
  preview: settingsAvatarPhotoPreview,
  previewImg: settingsAvatarPhotoPreviewImg,
  onChange: () => settingsAvatarGrid.querySelectorAll('.avatar-option').forEach((b) => b.classList.remove('selected')),
});
settingsAvatarPhotoRemove.addEventListener('click', () => {
  settingsAvatarPhoto.reset();
  selectedSettingsAvatar = AVATAR_OPTIONS[0];
  renderAvatarGrid(settingsAvatarGrid, selectedSettingsAvatar, (a) => {
    selectedSettingsAvatar = a;
    settingsAvatarPhoto.reset();
  });
});

async function renderSettingsProfileForm() {
  const current = myProfile || (await fetchProfile()) || {};
  myProfile = current.display_name ? current : myProfile;
  settingsNameInput.value = current.display_name || '';
  settingsAvatarPhoto.reset();
  const isPhoto = (current.avatar || '').startsWith('http');
  selectedSettingsAvatar = isPhoto ? current.avatar : (current.avatar || AVATAR_OPTIONS[0]);
  renderAvatarGrid(settingsAvatarGrid, isPhoto ? null : selectedSettingsAvatar, (a) => {
    selectedSettingsAvatar = a;
    settingsAvatarPhoto.reset();
  });
  if (isPhoto) {
    settingsAvatarPhotoPreviewImg.src = current.avatar;
    settingsAvatarPhotoPreview.hidden = false;
    settingsAvatarPhotoBtn.hidden = true;
  }
  profileSavedMsg.hidden = true;
}

profileForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = settingsNameInput.value.trim();
  if (!name) return;
  profileSaveBtn.disabled = true;
  try {
    myProfile = await saveProfile(name, selectedSettingsAvatar, settingsAvatarPhoto.getFile());
    await renderSettingsProfileForm();
    showFormMsg(profileSavedMsg, t('savedToast'), true);
  } catch (err) {
    showFormMsg(profileSavedMsg, t('saveFailed', { msg: err.message }));
  } finally {
    profileSaveBtn.disabled = false;
  }
});

goLoginBtn.addEventListener('click', () => {
  localStorage.removeItem('authMode');
  location.reload();
});

function showPasswordMsg(message, success = false) {
  passwordMsg.textContent = message;
  passwordMsg.classList.toggle('success', success);
  passwordMsg.hidden = false;
}

passwordForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = newPasswordInput.value;
  if (password !== newPasswordConfirmInput.value) {
    showPasswordMsg(t('passwordMismatch'));
    return;
  }
  if (password.length < 6) {
    showPasswordMsg(t('passwordTooShort'));
    return;
  }
  passwordSaveBtn.disabled = true;
  try {
    const { error } = await supabaseClient.auth.updateUser({ password });
    if (error) throw error;
    passwordForm.reset();
    showPasswordMsg(t('passwordUpdated'), true);
  } catch (err) {
    showPasswordMsg(err.message);
  } finally {
    passwordSaveBtn.disabled = false;
  }
});

// --- Language toggle ---
// Two toggle instances share this wiring: one in Settings, one on the
// auth screen (so an English-speaking visitor can switch before signing in).
const languageToggles = document.querySelectorAll('.lang-toggle');

// Re-runs the handful of places that set their own text based on runtime
// state (auth mode, password-visibility, edit-mode, signed-in-ness) —
// applyStaticI18n() only knows about static data-i18n chrome, not these.
function refreshDynamicChrome() {
  setAuthFormMode(authFormMode);
  syncPasswordToggleLabels();
  updateLogFormLabels();
  updateWishlistFormLabels();
  updateSettingsAccountView();
}

function setLanguage(lang) {
  currentLang = lang === 'en' ? 'en' : 'zh';
  try {
    localStorage.setItem('lang', currentLang);
  } catch {
    // localStorage unavailable (private window etc.) — language choice just won't persist
  }
  languageToggles.forEach((toggle) => {
    toggle.querySelectorAll('.seg-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.lang === currentLang);
    });
  });
  applyStaticI18n();
  refreshDynamicChrome();
  // Re-render already-loaded lists (notebook/wishlist/community feed) so
  // their embedded strings and date formatting pick up the new language too.
  loadEntries();
  loadNotes();
}

languageToggles.forEach((toggle) => {
  toggle.querySelectorAll('.seg-btn').forEach((btn) => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });
});

languageToggles.forEach((toggle) => {
  toggle.querySelectorAll('.seg-btn').forEach((b) => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });
});
applyStaticI18n();
refreshDynamicChrome();
</script>
