<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shanghai Dessert Guide</title>
<style>
  html { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #fff; color: #111; }
  #log { border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 320px; overflow-y: auto; margin-bottom: 12px; background: #fff; }
  .msg { margin-bottom: 10px; }
  .msg.user { text-align: right; color: #444; }
  .msg.agent { text-align: left; color: #111; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 8px; }
  button { padding: 8px 14px; }
</style>
</head>
<body>
<h2>Shanghai Dessert Guide</h2>
<div id="log"></div>
<form id="chat-form">
  <input type="text" id="message" placeholder="Ask about a dessert spot, or 说中文也可以…" autocomplete="off" />
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('chat-form');
const input = document.getElementById('message');
const sessionId = crypto.randomUUID();

function addMessage(text, who) {
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMessage(message, 'user');
  input.value = '';

  const body = new FormData();
  body.append('message', message);
  body.append('session_id', sessionId);

  const res = await fetch('/chat', { method: 'POST', body });
  const data = await res.json();
  addMessage(data.reply, 'agent');

  if (data.audio_url) {
    const audio = new Audio(data.audio_url);
    audio.play();
  }
});
</script>
</body>
</html>
