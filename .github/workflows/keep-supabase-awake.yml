name: Keep Supabase awake

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /notes (runs a real Supabase query)
        run: curl --fail --silent --show-error --max-time 30 https://crumbnearme.com/notes > /dev/null
