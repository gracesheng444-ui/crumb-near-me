<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>上海甜品指南</title>
<link rel="icon" type="image/png" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #fdf6f1;
    --bg-accent: #fff;
    --text: #2a221e;
    --text-dim: #8a7b73;
    --card: #ffffff;
    --border: #f0e0d6;
    --accent: #ef6448;
    --accent-dim: #fbe0d8;
    --accent-2: #dc9257;
    --accent-2-dim: #f8e6d3;
    --user-bubble: #ef6448;
    --user-text: #fff;
    --agent-bubble: #fff;
    --shadow: 0 2px 10px rgba(60, 30, 15, 0.06);
    --shadow-lg: 0 6px 20px rgba(60, 30, 15, 0.1);
    --font-display: "ZCOOL KuaiLe", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  button, input, textarea, select { font-family: inherit; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: var(--font-display);
    background:
      radial-gradient(circle at 15% 0%, var(--accent-dim), transparent 45%),
      radial-gradient(circle at 100% 15%, var(--accent-2-dim), transparent 40%),
      var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  svg.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex-shrink: 0; }

  .app {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  header::after {
    content: "";
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 0;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
    opacity: 0.5;
  }
  .logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  header h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 19px;
    margin: 0;
    line-height: 1.3;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  #chat-view, #collection-view, #community-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 6px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .icon-badge {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 14px;
  }
  .icon-badge.gold { background: var(--accent-2-dim); color: var(--accent-2); }

  .icon-badge-wrap {
    position: relative;
    width: 60px;
    margin: 0 auto 14px;
  }
  .icon-badge-wrap .icon-badge { margin: 0; }
  .sprinkles {
    position: absolute;
    width: 88px;
    height: 88px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    padding: 20px;
  }
  .empty-state p { font-size: 13.5px; max-width: 320px; margin: 4px auto 0; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 12.5px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

  .row {
    display: flex;
    gap: 8px;
    max-width: 88%;
    animation: rise 0.2s ease;
  }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.agent { align-self: flex-start; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
    background: var(--accent-dim);
    color: var(--accent);
  }
  .row.user .avatar { background: var(--accent); color: #fff; }
  .avatar.pin { background: var(--accent-2-dim); color: var(--accent-2); }

  .bubble-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .bubble {
    position: relative;
    padding: 11px 15px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -3px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-radius: 20px 20px 6px 20px;
    box-shadow: 0 3px 0 color-mix(in srgb, var(--user-bubble) 75%, black), var(--shadow);
  }
  .row.user .bubble::after {
    right: 9px;
    background: var(--accent-2);
  }
  .row.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 20px 20px 20px 6px;
    box-shadow: 0 3px 0 var(--border), var(--shadow);
  }
  .row.agent .bubble::after {
    left: 9px;
    background: #8fb87a;
  }
  .row.agent .bubble.error {
    background: #fdeceb;
    border-color: #f3b8b0;
    color: #a63a2b;
    box-shadow: 0 3px 0 #f3b8b0, var(--shadow);
  }
  .row.agent .bubble.error::after {
    background: #e28277;
  }

  .replay-btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .replay-btn:hover { color: var(--accent); border-color: var(--accent); }

  .id-card {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 8px 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  .id-card .thumb {
    width: 38px; height: 38px; border-radius: 9px;
    object-fit: cover; flex-shrink: 0; background: var(--accent-2-dim);
  }
  .id-card .name { font-weight: 600; }
  .id-card .sub { color: var(--text-dim); font-size: 11.5px; }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 15px;
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form#chat-form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-accent);
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:disabled { opacity: 0.5; cursor: default; }

  #message {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 15px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
    max-height: 110px;
    line-height: 1.4;
  }
  #message:focus { outline: none; border-color: var(--accent); }

  #send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  #send-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  #send-btn:not(:disabled):active { transform: scale(0.92); }

  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  #bottom-nav {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--card);
    box-shadow: 0 -2px 10px rgba(60, 30, 15, 0.05);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #bottom-nav button {
    flex: 1;
    border: none;
    background: none;
    color: var(--text-dim);
    padding: 6px 4px 8px;
    font-size: 11px;
    font-family: var(--font-display);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  #bottom-nav button svg.icon { width: 18px; height: 18px; }
  #bottom-nav .nav-icon-wrap {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tab-color);
    opacity: 0.6;
    transition: background 0.18s ease, opacity 0.18s ease, transform 0.15s ease;
  }
  #bottom-nav button.active .nav-icon-wrap {
    opacity: 1;
    background: var(--tab-color-dim);
    transform: scale(1.06);
  }
  #bottom-nav .nav-label { transition: color 0.18s ease; }
  #bottom-nav button.active .nav-label { color: var(--tab-color); font-weight: 600; }

  #tab-chat { --tab-color: var(--accent); --tab-color-dim: var(--accent-dim); }
  #tab-collection { --tab-color: var(--accent-2); --tab-color-dim: var(--accent-2-dim); }
  #tab-community { --tab-color: #d6588f; --tab-color-dim: #f9e0ea; }

  #collection-view {
    overflow-y: auto;
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 15px;
    box-shadow: var(--shadow);
  }
  .card-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 11px;
  }
  .card-heading .icon-badge {
    width: 28px; height: 28px; font-size: 14px; margin: 0;
  }
  .card-heading h3 {
    font-family: var(--font-display);
    margin: 0;
    font-size: 15.5px;
    color: var(--text);
    font-weight: 400;
  }
  #log-form { display: flex; flex-direction: column; gap: 8px; }
  #log-form input, #log-form textarea {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg-accent);
    color: var(--text);
  }
  #log-form input:focus, #log-form textarea:focus { outline: none; border-color: var(--accent); }
  #log-form textarea { resize: none; min-height: 44px; }
  .star-picker { display: flex; gap: 4px; }
  .star-picker button {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-dim);
    padding: 0;
    line-height: 1;
    font-size: 24px;
    opacity: 0.55;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .star-picker button:hover { opacity: 0.85; transform: scale(1.08); }
  .star-picker button svg.icon path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .star-picker button.filled { color: var(--accent-2); opacity: 1; }
  .star-picker button.filled svg.icon path { fill: currentColor; stroke: none; }
  #log-form-submit {
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-display);
    box-shadow: var(--shadow);
  }
  #log-form-submit:disabled { opacity: 0.5; cursor: default; box-shadow: none; }

  #summary-btn {
    border: 1px solid var(--accent-2);
    background: var(--accent-2-dim);
    color: #8a5527;
    border-radius: 10px;
    padding: 10px;
    font-size: 14.5px;
    cursor: pointer;
    font-family: var(--font-display);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  #summary-text {
    margin-top: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
  }

  .collection-empty {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px;
  }

  #log-photo-row, #note-photo-row { display: flex; align-items: center; gap: 10px; }
  #log-photo-btn, #note-photo-btn {
    border: 1px solid var(--border);
    background: var(--bg-accent);
    color: var(--text-dim);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #log-photo-preview, #note-photo-preview { position: relative; display: inline-block; }
  #log-photo-preview img, #note-photo-preview img {
    width: 44px; height: 44px; border-radius: 10px;
    object-fit: cover; display: block; border: 1px solid var(--border);
  }
  #log-photo-remove, #note-photo-remove {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 9px; display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer;
  }
  #notebook {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 18px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 440px;
    position: relative;
    background-image: repeating-linear-gradient(
      to bottom, transparent 0px, transparent 27px, var(--border) 27px, var(--border) 28px
    );
    background-position: 0 66px;
  }
  #notebook::before {
    content: "";
    position: absolute;
    left: 36px; top: 14px; bottom: 14px;
    width: 1px;
    background: var(--accent-2-dim);
  }
  #notebook-page {
    flex: 1;
    display: flex;
    padding-left: 16px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .notebook-page-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .notebook-page-content.centered { justify-content: center; align-items: center; }
  #notebook-page.flip-next { transform: translateX(-18px); opacity: 0; }
  #notebook-page.flip-prev { transform: translateX(18px); opacity: 0; }

  .notebook-photo-frame {
    align-self: center;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 8px 20px;
    box-shadow: var(--shadow-lg);
    position: relative;
    margin-top: 2px;
  }
  .notebook-photo-frame img {
    width: 148px; height: 148px; object-fit: cover; border-radius: 2px;
    display: block; background: var(--bg-accent);
  }
  .notebook-photo-frame::before {
    content: "";
    position: absolute;
    top: -9px; left: 50%;
    transform: translateX(-50%);
    width: 44px; height: 16px;
    background: rgba(220, 146, 87, 0.35);
    border: 1px solid rgba(220, 146, 87, 0.5);
  }

  .notebook-title { font-family: var(--font-display); font-weight: 400; font-size: 18px; text-align: center; margin: 2px 0 0; }
  .notebook-store { text-align: center; color: var(--text-dim); font-size: 12.5px; }
  .notebook-date { text-align: center; color: var(--text-dim); font-size: 11px; }
  .notebook-stars { display: flex; justify-content: center; gap: 2px; color: var(--accent-2); }
  .notebook-stars svg.icon { width: 15px; height: 15px; }
  .notebook-note {
    background: var(--bg-accent);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    margin: 0 6px;
  }
  .notebook-actions { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: auto; padding-top: 8px; }
  .notebook-del-btn {
    border: none; background: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 0; display: flex;
  }
  .notebook-del-btn:hover { color: var(--accent); }
  .notebook-heading {
    text-align: center; color: var(--text-dim); font-size: 13px;
    padding: 0 10px;
  }

  #notebook-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  #notebook-nav button {
    border: 1px solid var(--border);
    background: var(--bg-accent);
    color: var(--text);
    border-radius: 9px;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #notebook-nav button:hover:not(:disabled) { border-color: var(--accent-2); color: var(--accent-2); }
  #notebook-nav button:disabled { opacity: 0.35; cursor: default; }
  #notebook-page-indicator { font-size: 12px; color: var(--text-dim); min-width: 56px; text-align: center; }

  #community-view { overflow-y: auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .segmented {
    display: flex;
    gap: 4px;
    background: var(--bg-accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    flex-shrink: 0;
  }
  .segmented .seg-btn {
    flex: 1;
    border: none;
    background: none;
    color: var(--text-dim);
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
  }
  .segmented .seg-btn.active {
    background: var(--seg-color, var(--accent-2));
    color: #fff;
    box-shadow: var(--shadow);
  }
  #community-view .segmented { --seg-color: #d6588f; }
  #community-pane-browse, #community-pane-publish,
  #collection-pane-log, #collection-pane-view {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .disclaimer {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
    background: var(--bg-accent);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 8px 11px;
  }
  .disclaimer svg.icon { flex-shrink: 0; color: var(--accent-2); }
  #note-form { display: flex; flex-direction: column; gap: 8px; }
  #note-form input, #note-form textarea {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg-accent);
    color: var(--text);
  }
  #note-form input:focus, #note-form textarea:focus { outline: none; border-color: var(--accent); }
  #note-form textarea { resize: none; min-height: 60px; }
  #note-form-submit {
    border: none;
    background: linear-gradient(135deg, var(--accent), #ff9470);
    color: #fff;
    border-radius: 10px;
    padding: 11px;
    font-size: 15px;
    cursor: pointer;
    font-family: var(--font-display);
    box-shadow: var(--shadow);
  }
  #note-form-submit:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  .note-entry {
    background: var(--card);

<script>
// --- Auth (Supabase) ---
const authView = document.getElementById('auth-view');
const mainApp = document.getElementById('main-app');
const tabLogin = document.getElementById('tab-login');
const tabSignup = document.getElementById('tab-signup');
const authForm = document.getElementById('auth-form');
const authEmail = document.getElementById('auth-email');
const authPassword = document.getElementById('auth-password');
const authPasswordConfirm = document.getElementById('auth-password-confirm');
const authSubmit = document.getElementById('auth-submit');
const authError = document.getElementById('auth-error');
const guestBtn = document.getElementById('guest-btn');
const logoutBtn = document.getElementById('logout-btn');

let authFormMode = 'login'; // 'login' | 'signup'

function setAuthFormMode(mode) {
  authFormMode = mode;
  tabLogin.classList.toggle('active', mode === 'login');
  tabSignup.classList.toggle('active', mode === 'signup');
  authPasswordConfirm.hidden = mode !== 'signup';
  authPasswordConfirm.required = mode === 'signup';
  authPassword.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
  authSubmit.textContent = mode === 'signup' ? '注册' : '登录';
  authError.hidden = true;
}

// authToken/userId are `let`, not `const` — Supabase's session check is
// async, and its background token refresh can update authToken again later,
// so both need to stay reassignable rather than fixed at page load.
let authToken = null;
let supabaseClient = null;

function showApp() {
  authView.hidden = true;
  mainApp.hidden = false;
  logoutBtn.hidden = !authToken;
}

function showAuthMessage(message, isError = true) {
  authError.textContent = message;
  authError.classList.toggle('auth-success', !isError);
  authError.hidden = false;
}

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.hidden = true;
  const email = authEmail.value.trim();
  const password = authPassword.value;
  if (authFormMode === 'signup' && password !== authPasswordConfirm.value) {
    showAuthMessage('两次输入的密码不一致');
    return;
  }
  authSubmit.disabled = true;
  try {
    if (authFormMode === 'signup') {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) {
        // Email confirmation is required before a session exists — the
        // account is created, but signing in has to wait until they click
        // the link Supabase just emailed them.
        setAuthFormMode('login');
        showAuthMessage('注册成功！请查收邮箱并点击确认链接，然后回来登录。', false);
      }
      // If confirmation is disabled on the project, signUp already returns
      // a session and onAuthStateChange below handles showing the app.
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    showAuthMessage(err.message);
  } finally {
    authSubmit.disabled = false;
  }
});

  location.reload();
});

logoutBtn.addEventListener('click', async () => {
  if (supabaseClient) await supabaseClient.auth.signOut();
  localStorage.removeItem('authMode');
  location.reload();
});

// Guest mode needs no network round trip, so it can show the app instantly
// rather than waiting on the Supabase session check below.
if (localStorage.getItem('authMode') === 'guest') {
  showApp();
}

async function initSupabaseAuth() {
  const cfg = await fetch('/config').then((r) => r.json());
  supabaseClient = supabase.createClient(cfg.supabase_url, cfg.supabase_publishable_key);

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    authToken = session ? session.access_token : null;
    if (session) {
      userId = session.user.id;
      showApp();
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    authToken = session.access_token;
    userId = session.user.id;
    showApp();
  } else if (localStorage.getItem('authMode') !== 'guest') {
    authView.hidden = false;
    mainApp.hidden = true;
  }
}

let allEntries = [];
let notebookIndex = 0;

const notebookPageEl = document.getElementById('notebook-page');
const notebookPrevBtn = document.getElementById('notebook-prev');
const notebookNextBtn = document.getElementById('notebook-next');
const notebookIndicator = document.getElementById('notebook-page-indicator');

function getNotebookEntries() {
  return allEntries.filter((e) => e.status !== 'planned'); // already newest-first from the API
}

function renderNotebook() {
  const entries = getNotebookEntries();
  notebookIndex = Math.max(0, Math.min(notebookIndex, Math.max(entries.length - 1, 0)));

  notebookPageEl.innerHTML = '';
  notebookPageEl.appendChild(
    entries.length === 0 ? buildNotebookEmptyPage() : buildNotebookEntryPage(entries[notebookIndex])
  );

  notebookIndicator.textContent = entries.length === 0 ? '' : `${notebookIndex + 1} / ${entries.length}`;
  notebookPrevBtn.disabled = notebookIndex === 0 || entries.length === 0;
  notebookNextBtn.disabled = entries.length === 0 || notebookIndex === entries.length - 1;
}

function flipNotebook(direction) {
  notebookPageEl.classList.add(direction > 0 ? 'flip-next' : 'flip-prev');
  setTimeout(() => {
    notebookIndex += direction;
    renderNotebook();
    notebookPageEl.classList.remove('flip-next', 'flip-prev');
  }, 200);
}

notebookPrevBtn.addEventListener('click', () => {
  if (notebookIndex > 0) flipNotebook(-1);
});
notebookNextBtn.addEventListener('click', () => {
  if (notebookIndex < getNotebookEntries().length - 1) flipNotebook(1);
});

    const res = await fetch('/notes', { method: 'POST', body, headers: authHeaders() });
    if (!res.ok) throw new Error(`服务器返回了 ${res.status}`);

    notePlace.value = '';
    noteText.value = '';
    noteAuthor.value = '';
    clearNotePhotoPicker();
    loadNotes();
    setCommunityPane('browse');
  } catch (err) {
    alert(`发布失败 — ${err.message}`);
  } finally {
    noteFormSubmit.disabled = false;
  }
});
</script>
</body>
</html>
